# Illustrative Nav2 parameter file. Fabricated for reference -- not a real
# robot's configuration.
#
# This is the "before" state referenced by sample-output-pass.txt. A
# developer bumping controller_server.FollowPath.max_vel_x / the
# velocity_smoother.max_velocity X-axis value from 0.40 to 0.60 without
# updating the approved policy is what sample-output-block.txt illustrates.

controller_server:
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.10
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_vel_x: 0.40
      max_vel_theta: 1.50
      acc_lim_x: 2.00
      acc_lim_theta: 4.00

velocity_smoother:
  ros__parameters:
    max_velocity: [0.40, 0.20, 1.50]
    max_accel: [2.00, 2.00, 4.00]

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.20
      inflation_layer:
        inflation_radius: 0.50

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.20
      inflation_layer:
        inflation_radius: 0.50

max_scaling_factor: 0.90
